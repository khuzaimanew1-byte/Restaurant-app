<style>
        body {
            background-color: #121212; /* Deep ebony */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .kumiko-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 215, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 215, 0, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
            pointer-events: none;
        }

        .frame-container {
            position: relative;
            width: 80vw;
            max-width: 1200px;
            height: 70vh;
            max-height: 800px;
            background-color: #1a1a1a; /* Slightly lighter than bg to pop */
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .inner-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255, 215, 0, 0.8); /* Sharp Gold Outer */
            box-sizing: border-box;
            background: linear-gradient(135deg, rgba(42,31,29,0.9) 0%, rgba(18,18,18,0.95) 100%); /* Cedar to Ebony gradient */
            display: flex;
            flex-direction: column;
        }

        .inner-frame::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid rgba(255, 215, 0, 0.4); /* Inner thinner gold line */
            pointer-events: none;
        }

        /* Architectural SVG Corners */
        .corner-ornament {
            position: absolute;
            width: 60px;
            height: 60px;
            fill: none;
            stroke: #FFD700;
            stroke-width: 1.5;
            z-index: 20;
        }

        .top-left { top: -2px; left: -2px; }
        .top-right { top: -2px; right: -2px; transform: scaleX(-1); }
        .bottom-left { bottom: -2px; left: -2px; transform: scaleY(-1); }
        .bottom-right { bottom: -2px; right: -2px; transform: scale(-1, -1); }

    </style>
</head>
