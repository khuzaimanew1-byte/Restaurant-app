name: attendance_onboarding
description: Production-ready Flutter auth + onboarding for an Attendance Management App.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend — Back4App / Parse
  parse_server_sdk_flutter: ^7.0.3

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.5

  # Storage
  shared_preferences: ^2.3.1

  # Crypto — password hashing
  crypto: ^3.0.5

  # Animations
  flutter_animate: ^4.5.2

  # UI helpers
  cupertino_icons: ^1.0.8
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
